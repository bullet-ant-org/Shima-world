<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05060d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <title>Shima World</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #05060d; color: #e9ecff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 30%, #1a1440, #05060d 70%); text-align: center; padding: 20px; z-index: 10; }
    .screen.show { display: flex; }
    h1 { margin: 0; font-size: clamp(28px, 7vh, 56px); letter-spacing: .25em; font-weight: 300; }
    h1 b { color: #ff3d6e; font-weight: 600; }
    p { margin: 0; opacity: .75; max-width: 520px; }
    button { background: linear-gradient(90deg, #ff3d6e, #7a5cff); border: 0; color: #fff; font-size: 17px; padding: 12px 28px; border-radius: 8px; letter-spacing: .12em; cursor: pointer; }
    button.alt { background: #1b1f3a; border: 1px solid #3a4075; }
    .bar { width: min(420px, 80vw); height: 8px; background: #1b1f3a; border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #00e5ff, #7a5cff); transition: width .2s; }
    #rotate { background: #05060d; z-index: 50; }
    @media (orientation: portrait) { #rotate { display: flex !important; } }
    #hud { position: fixed; left: 8px; top: 8px; font: 11px/1.4 monospace; color: #9fffe0; white-space: pre; z-index: 5; pointer-events: none; text-shadow: 0 0 3px #000; }
    #topbtns { position: fixed; right: 10px; top: 10px; display: flex; gap: 8px; z-index: 6; }
    #topbtns button { padding: 8px 14px; font-size: 13px; }
    #update-btn { display: none; background: linear-gradient(90deg, #00e5ff, #00b36b); }
    #stickL { position: fixed; bottom: 18px; width: 130px; height: 130px; border-radius: 50%; border: 2px solid #ffffff44; background: #ffffff10; z-index: 5; }
    #stickL { left: 28px; }
    .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: #ffffff55; }
    #acts { position: fixed; right: 26px; bottom: 26px; display: grid; grid-template-columns: 74px 74px; gap: 12px; z-index: 5; }
    #acts button { width: 74px; height: 74px; border-radius: 50%; padding: 0; font-size: 12px; font-weight: 600; }
    #fly-btn { background: linear-gradient(135deg, #25c8e6, #7a5cff); }
    #fly-btn.on { background: linear-gradient(135deg, #ffb02e, #ff3d6e); }
    #boost-btn { background: #1b1f3a; border: 1px solid #3a4075; visibility: hidden; }
    #boost-btn.show { visibility: visible; }
    #boost-btn.on { background: linear-gradient(135deg, #ff3d9a, #ffb02e); }
    #speedfx { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; background: radial-gradient(ellipse at center, transparent 42%, rgba(140,220,255,.18) 70%, rgba(220,245,255,.55) 100%); mix-blend-mode: screen; }
    #travel { position: fixed; right: 10px; top: 54px; display: none; flex-direction: column; gap: 6px; z-index: 7; }
    #travel.show { display: flex; }
    #travel button { padding: 9px 14px; font-size: 12px; text-align: left; background: #14183a; border: 1px solid #3a4075; }
    #zone { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); font-size: 13px; letter-spacing: .3em; opacity: .85; z-index: 5; text-shadow: 0 0 4px #000; }

    #builder { background: #0b0d1f; padding: 0; gap: 0; flex-direction: row; align-items: stretch; justify-content: stretch; text-align: left; }
    #cb-view { position: relative; flex: 1 1 50%; min-width: 0; }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #cb-demo { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; }
    #cb-note { position: absolute; left: 10px; top: 10px; font-size: 12px; opacity: .8; max-width: 80%; }
    #cb-side { flex: 0 0 min(46%, 440px); display: flex; flex-direction: column; background: #12162f; border-left: 1px solid #3a4075; padding-top: env(safe-area-inset-top); }
    #cb-top { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; }
    #cb-tabs { display: flex; gap: 6px; padding: 0 8px 8px; }
    #builder button { padding: 8px 12px; font-size: 12px; letter-spacing: .06em; }
    #builder button.on { background: linear-gradient(90deg, #ff3d6e, #7a5cff); border-color: transparent; }
    #cb-panel { flex: 1; overflow-y: auto; padding: 4px 12px 12px; touch-action: pan-y; }
    .cb-row { margin: 8px 0; } .cb-row label { display: block; font-size: 12px; opacity: .7; margin-bottom: 4px; letter-spacing: .08em; }
    .cb-row input[type=range] { width: 100%; accent-color: #ff3d6e; }
    .cb-opts { display: flex; flex-wrap: wrap; gap: 5px; }
    .cb-sw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .cb-sw i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ffffff33; cursor: pointer; }
    .cb-sw i.on { border-color: #fff; box-shadow: 0 0 0 2px #ff3d6e; }
    .cb-sw input { width: 32px; height: 28px; padding: 0; border: 0; background: none; }
    #cb-done { margin: 8px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Install gate: game will not run until installed as PWA -->
  <div id="gate" class="screen">
    <h1><b>島</b> SHIMA WORLD</h1>
    <p id="gate-msg">Download the game to your device to play. It installs once, then loads from local storage.</p>
    <div class="bar" id="dl-bar" style="display:none"><i id="dl-fill"></i></div>
    <p id="dl-text"></p>
    <button id="install-btn">DOWNLOAD GAME</button>
    <p id="ios-hint" style="display:none">On iPhone/iPad: tap Share, then “Add to Home Screen”, then open Shima World from your home screen.</p>
  </div>

  <div id="menu" class="screen">
    <h1><b>島</b> SHIMA WORLD</h1>
    <button id="play-btn">CONTINUE</button>
    <button id="char-btn" class="alt">CHARACTER</button>
    <button id="gfx-btn" class="alt">GRAPHICS: ADAPTIVE</button>
    <button id="ink-btn" class="alt">OUTLINES: HERO</button>
    <button id="upd-menu-btn" class="alt">CHECK FOR UPDATE</button>
    <p id="menu-info"></p>
  </div>

  <div id="builder" class="screen">
    <div id="cb-view"><canvas id="preview"></canvas><p id="cb-note"></p>
      <div id="cb-demo"><button id="cb-demo-idle" class="alt">IDLE</button><button id="cb-demo-walk" class="alt">WALK</button><button id="cb-demo-fly" class="alt">FLY</button></div></div>
    <div id="cb-side">
      <div id="cb-top"><button id="cb-gender" class="alt">FEMALE</button><button id="cb-random" class="alt">RANDOMIZE</button><button id="cb-reset" class="alt">RESET</button></div>
      <div id="cb-tabs"></div><div id="cb-panel"></div>
      <button id="cb-done">SAVE &amp; BACK</button>
    </div>
  </div>
  <div id="loading" class="screen"><h1>LOADING</h1><div class="bar"><i id="load-fill"></i></div><p id="load-text"></p></div>

  <div id="rotate" class="screen"><h1>ROTATE DEVICE</h1><p>Shima World plays in landscape only.</p></div>

  <div id="hud"></div>
  <div id="zone"></div>
  <div id="topbtns">
    <button id="update-btn">UPDATE</button>
    <button id="travel-btn" class="alt">TRAVEL</button>
    <button id="dbg-btn" class="alt">DEBUG</button>
  </div>
  <div id="travel"></div>
  <div id="stickL"><div class="knob"></div></div>
  <div id="speedfx"></div>
  <div id="acts"><button id="fly-btn">FLY</button><button id="boost-btn">BOOST</button><button id="jump-btn" class="alt">JUMP</button><button id="run-btn" class="alt">RUN</button></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
